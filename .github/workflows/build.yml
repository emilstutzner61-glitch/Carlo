name: APK bauen
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq wallet-apk.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p wallet-apk assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Wallet-APK
          path: wallet-apk/app/build/outputs/apk/debug/app-debug.apk
